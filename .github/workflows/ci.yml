name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/ci
          JWT_SECRET: test-ci-secret-please-ignore
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: npm run build
