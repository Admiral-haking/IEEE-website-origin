name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/ci
          JWT_SECRET: deploy-ci-secret-please-ignore
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: npm run build

      - name: Pack artifact
        run: |
          zip -r deployment-package.zip .next package.json package-lock.json next.config.mjs public config -x "*.git*" "node_modules/*"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: deployment-package.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment: production
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment-package
          path: .

      - name: Copy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "deployment-package.zip"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            mkdir -p ${{ secrets.DEPLOY_PATH }}
            cd ${{ secrets.DEPLOY_PATH }}
            # Ensure unzip and PM2 are available
            if ! command -v unzip >/dev/null 2>&1; then
              apt-get update -y && apt-get install -y unzip
            fi
            if ! command -v pm2 >/dev/null 2>&1; then
              npm install -g pm2
            fi
            unzip -o deployment-package.zip
            npm ci --omit=dev
            PM2_APP_NAME="${{ secrets.PM2_APP_NAME }}"
            if [ -z "$PM2_APP_NAME" ]; then PM2_APP_NAME="IEEE-website"; fi
            pm2 restart "$PM2_APP_NAME" || pm2 start npm --name "$PM2_APP_NAME" -- start
            # Health check (adjust URL if behind reverse proxy)
            sleep 3
            curl -fsS http://127.0.0.1:3000/api/health || curl -fsS http://127.0.0.1:3000 || (pm2 logs "$PM2_APP_NAME" --lines 50 && exit 1)
